name: Tests

# Runs the pytest suite (via Pixi) on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.68.1
          environments: test
      - run: pixi run -e test test
